<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SCAJ2026 文言レビュー</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0,0&icon_names=add_comment,check_circle,content_copy,crop_free,fit_screen,map,rate_review,save,task_alt,text_fields&display=block">
<style>
  html{color-scheme:light}
  :root{
    --bg:#edede8; --ink:#1a1a1a; --ink-2:#4a4a46; --ink-3:#8a8a84; --rule:#1a1a1a;
    --rule-soft:rgba(26,26,26,.28); --field:#f8f8f5; --bar:#e4e4de;
    --roll:#f6f4ee; --stage:#d9d9d4; --soil:#3d3026; --bag:#ede5d6;
    --ok:#2f6b3a; --warn:#a0521a; --err:#a3302b;
    --hdr:44px;
    --upd-bg:#fbf3d2; --upd-line:#cfae3c; --upd-ink:#1a1a1a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1c1a; --ink:#edede8; --ink-2:#c2c2bb; --ink-3:#8c8c85; --rule:#edede8;
      --rule-soft:rgba(237,237,232,.28); --field:#2a2a27; --bar:#262624;
      --ok:#8fd19b; --warn:#f0a56a; --err:#f08a84;
      --upd-bg:#39331d; --upd-line:#9c8636; --upd-ink:#edede8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1c1a; --ink:#edede8; --ink-2:#c2c2bb; --ink-3:#8c8c85; --rule:#edede8;
    --rule-soft:rgba(237,237,232,.28); --field:#2a2a27; --bar:#262624;
    --ok:#8fd19b; --warn:#f0a56a; --err:#f08a84;
    --upd-bg:#39331d; --upd-line:#9c8636; --upd-ink:#edede8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-weight:400;font-size:13px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
  button,input,textarea,select{font:inherit;color:inherit}
  button{background:none;border:1px solid var(--rule);border-radius:0;padding:5px 12px;cursor:pointer;line-height:1.4;white-space:nowrap}
  button:hover{background:var(--ink);color:var(--bg)}
  button.primary{border-width:1.5px;font-weight:500}
  button.primary:hover{background:var(--ink);color:var(--bg)}
  button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  button[disabled]{opacity:.4;cursor:default}
  button[disabled]:hover{background:none;color:inherit}
  button.primary[disabled]:hover{background:none;color:inherit}

  header{border-bottom:1px solid var(--rule);padding:6px 16px;display:flex;gap:14px;align-items:center;flex:none;min-height:var(--hdr)}
  header h1{font-size:15px;font-weight:300;margin:0;letter-spacing:.02em;white-space:nowrap}
  header .sub{font-size:10px;color:var(--ink-3);font-weight:300;white-space:nowrap}
  .faces{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
  .faces::-webkit-scrollbar{display:none}
  .faces button{padding:2px 8px;min-width:34px;font-variant-numeric:tabular-nums;position:relative;border-color:var(--rule-soft);flex:none}
  .faces button.on{background:none;color:inherit;border-color:var(--ink);border-width:2px;font-weight:500}
  .faces button .ok{font-size:9px;margin-left:3px;color:var(--ok)}
  .faces button .chg{position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .faces .sep{width:1px;background:var(--rule-soft);margin:0 4px;flex:none}
  .status{font-size:11px;color:var(--ink-3);text-align:right;white-space:nowrap}

  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
  .preview{display:flex;flex-direction:column;border-right:1px solid var(--rule);min-width:0;min-height:0;background:var(--bg);overflow:hidden;contain:size layout}
  .ptools{display:flex;gap:6px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--rule-soft);font-size:11px;color:var(--ink-2);flex:none}
  .ptools .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptools button{padding:1px 8px;font-size:11px;border-color:var(--rule-soft)}
  .ptools button.on{background:none;border-color:var(--ink);font-weight:500}
  .map{flex:none;height:auto;max-height:26%;border-bottom:1px solid var(--rule-soft);padding:2px 8px;background:var(--bg)}
  .map[hidden]{display:none}
  .map svg{width:100%;height:auto;max-height:100%;display:block;color:var(--ink)}
  .map .ln{fill:none;stroke:currentColor;stroke-width:14}
  .map .thin{fill:none;stroke:currentColor;stroke-width:8;opacity:.55}
  .map .fill{fill:currentColor;opacity:.12;stroke:none}
  .map .roll{fill:var(--roll);stroke:currentColor;stroke-width:10}
  .map .lab{font-size:150px;fill:currentColor;opacity:.7;font-weight:300}
  .map .lab.b{font-size:170px;opacity:.9;font-weight:400}
  .map .mk{cursor:pointer}
  .map .mk circle{fill:var(--bg);stroke:currentColor;stroke-width:22}
  .map .mk text{font-size:200px;fill:currentColor;text-anchor:middle;dominant-baseline:central;font-weight:400}
  .map .mk.on circle{stroke-width:60} .map .mk.on text{font-weight:500}
  .map .mk.ghost{cursor:default} .map .mk.ghost circle{stroke-dasharray:40 40;opacity:.45} .map .mk.ghost text{opacity:.45}
  .map .mk.okd circle{stroke:var(--ok);stroke-width:34}
  .map .mk:hover circle{stroke-width:40}
  .stage{flex:1;position:relative;overflow:hidden;background:var(--bg);min-height:0}
  body.fonts-loading .frame{visibility:hidden}
  .scroller{position:relative;overflow:hidden}
  .frame{position:absolute;transform-origin:0 0;left:0;top:0;color:#1a1a1a;will-change:transform}
  .frame .r{position:absolute;border:0 solid #1a1a1a}
  .frame .t{position:absolute;margin:0;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;cursor:pointer;-webkit-font-smoothing:antialiased;backface-visibility:hidden}
  .frame .t.hl{outline:2px dashed rgba(160,82,26,.9);outline-offset:6px}
  .frame .t.updt{background:rgba(245,214,90,.42)}
  details.upd{background:var(--upd-bg);border:1px solid var(--upd-line);color:var(--upd-ink);padding:10px 12px 12px;margin:10px 0 14px}
  .upd>summary{cursor:pointer;list-style:none;font-size:13px;font-weight:500}
  .upd>summary::-webkit-details-marker{display:none}
  .upd .it{border-top:1px solid var(--upd-line);padding:8px 0 2px;margin-top:8px;font-size:12px;line-height:1.7}
  .upd .it .k{display:inline-block;min-width:5.2em;margin-right:6px;font-size:10px;font-weight:500;letter-spacing:.04em}
  .upd .it .cm{white-space:pre-wrap}
  .upd .it .ba{margin:4px 0 0 1em;font-size:11px}
  .upd .it .ba s{opacity:.65}
  .upd .it .todo{margin-top:4px;font-weight:500}
  .upd .it .todo::before{content:'要確認 ';font-size:10px;border:1px solid currentColor;padding:0 4px;margin-right:4px}
  .audit{background:var(--field)!important;border-color:var(--rule-soft)!important;color:var(--ink)!important}
  .audit .it{border-color:var(--rule-soft)}
  .audit .result{font-weight:500}
  .audit .result.done{color:var(--ok)}
  .audit .result.partial{color:var(--warn)}
  .audit .result.open{color:var(--err)}
  .fld .badge.u{background:var(--upd-bg);border-color:var(--upd-line);color:var(--upd-ink)}
  .faces button .u{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:8px;line-height:1;padding:1px 3px;background:var(--upd-bg);border:1px solid var(--upd-line);color:var(--upd-ink);white-space:nowrap}
  .faces button .u.done{background:var(--field);border-color:var(--ok);color:var(--ok)}
  .faces button .u.partial{background:var(--field);border-color:var(--warn);color:var(--warn)}
  .faces button .u.open{background:var(--field);border-color:var(--err);color:var(--err)}
  .flnote{position:absolute;right:0;bottom:0;text-align:right;padding:2px 10px;font-size:10px;color:var(--ink-3);pointer-events:none;background:var(--bg)}
  .stage{contain:size layout}

  .edcol{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;contain:size layout}
  .editor{flex:1;overflow:auto;padding:12px 16px 24px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .editor h2{font-size:14px;font-weight:400;margin:0;line-height:1.4}
  .editor h2 small{display:block;font-size:11px;color:var(--ink-3);font-weight:300}
  .grp{border-top:1px solid var(--rule);padding-top:6px}
  .grp > .gl{font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:4px}
  details.memo summary{cursor:pointer;list-style:none}
  details.memo summary::-webkit-details-marker{display:none}
  details.memo[open] summary{margin-bottom:6px}
  .fld{display:grid;grid-template-columns:1fr;gap:3px;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
  .fld .lab{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-2)}
  .fld .lab .meta{color:var(--ink-3);font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fld textarea{width:100%;background:var(--field);border:1px solid var(--rule-soft);padding:6px 8px;resize:vertical;min-height:38px;line-height:1.6;font-size:16px}
  .fld textarea.big{font-family:"Noto Serif JP",serif;font-size:17px}
  .fld.diff textarea{border-color:var(--warn)}
  .fld.unsaved textarea{border-style:dashed;border-color:var(--ink)}
  .fld .fig{font-size:11px;color:var(--ink-3);font-weight:300;white-space:pre-wrap}
  .fld .fig b{font-weight:400;color:var(--warn)}
  .fld .fig button{font-size:10px;padding:0 6px;margin-left:6px;border-color:var(--rule-soft)}
  .apr .who{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .apr .p{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .apr .p .t{color:var(--ink-3);font-size:11px;font-weight:300}
  .apr .stale{color:var(--warn)}
  .apr .none{color:var(--ink-3);font-weight:300}
  .cmt{display:flex;flex-direction:column;gap:6px}
  .cmt .list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
  .cmt .c{border-left:2px solid var(--rule-soft);padding:2px 10px;font-size:12px}
  .cmt .c .h{color:var(--ink-3);font-size:11px;font-weight:300}
  .cmt .in{display:flex;gap:6px;align-items:flex-start}
  .cmt .in select,.actbar select{background:var(--field);border:1px solid var(--rule-soft);padding:6px 4px;font-size:13px}
  .faces button .cm{font-size:9px;margin-left:2px}
  .cmt .in textarea{flex:1;background:var(--field);border:1px solid var(--rule-soft);padding:6px 8px;min-height:38px;resize:vertical;font-size:16px}
  .note{font-size:11px;color:var(--ink-3);font-weight:300;line-height:1.7}
  .badge{display:inline-block;border:1px solid currentColor;padding:0 6px;font-size:10px;line-height:1.6;margin-left:6px;vertical-align:middle}
  .badge.warn{color:var(--warn)} .badge.ok{color:var(--ok)} .badge.err{color:var(--err)}
  .okrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;min-height:22px;flex-wrap:wrap}
  .okrow .st{font-weight:300;color:var(--ink-3)}
  .okrow .st.ok{color:var(--ok)} .okrow .st.warn{color:var(--warn)} .okrow .st.stale{color:var(--warn)} .okrow .st.err{color:var(--err)}
  .okrow .okitem{padding:2px 12px;font-size:12px;background:none;color:inherit;border-color:var(--ink);flex:none}
  .okrow .btns{display:flex;gap:6px;flex:none}
  .okrow .okitem.done{background:none;color:var(--ok);border-color:var(--ok)}
  .okrow .stack{display:flex;flex-direction:column;gap:2px;min-width:0}
  .okrow .okitem.chk{background:none;color:inherit;border-color:var(--ink)}
  .faces button .ok.half{color:var(--ink-3)}
  .okrow .okitem.sub{background:none;color:inherit;border-color:var(--rule-soft);font-size:11px;padding:1px 8px}
  .fld.s-synced textarea{border-color:var(--ok)}
  .offline{border:1px solid var(--warn);color:var(--warn);padding:6px 10px;font-size:12px}
  .editor .prog{font-size:11px;color:var(--ink-3);font-weight:300;margin-top:-6px}
  .editor .prog .badge{margin-left:8px}
  .fld .lab{align-items:center;flex-wrap:wrap}
  .fld .lab .nm{font-size:13px;color:var(--ink)}
  .fld .lab .cnt{margin-left:8px;font-size:10px;color:var(--ink-3);font-weight:300;font-variant-numeric:tabular-nums}
  .fld .btns{display:flex;gap:6px;flex:none;margin-left:auto}
  .fld .okitem{padding:3px 12px;font-size:12px;background:none;color:inherit;border-color:var(--ink)}
  .fld .okitem.done{color:var(--ok);border-color:var(--ok)}
  .fld .okitem.stale{color:var(--warn);border-color:var(--warn)}
  details.more summary,details.help summary,details.memo summary{font-size:10px;color:var(--ink-3);cursor:pointer;list-style:none;display:inline-block;font-weight:300}
  details.more summary::-webkit-details-marker,details.help summary::-webkit-details-marker{display:none}
  details.more summary::before{content:'▸ '}
  details.more[open] summary::before{content:'▾ '}
  details.more summary .w{color:var(--warn);margin-left:6px}
  details.more .fig{display:block;margin-top:2px;line-height:1.7}

  /* 操作バー：名前・役割・一時保存・OK を一列に */
  .actbar{flex:none;border-top:1px solid var(--rule);background:var(--bar);padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .actbar .who{display:flex;align-items:center;gap:6px;flex:1;min-width:200px}
  .actbar label{font-size:11px;color:var(--ink-2);white-space:nowrap}

  .actbar .role{display:flex;border:1px solid var(--rule-soft)}
  .actbar .role button{border:none;padding:4px 10px;font-size:12px}
  .actbar .role button.on{background:var(--ink);color:var(--bg)}
  .actbar .msg{flex-basis:100%;font-size:11px;color:var(--ink-3);font-weight:300;min-height:1.2em}
  .actbar .msg.err{color:var(--err)} .actbar .msg.ok{color:var(--ok)}
  .busy{pointer-events:none;opacity:.6}

  @media (max-width:820px){
    body{font-size:13px}
    .map{max-height:120px}
    .preview.tall{height:78vh}
    header{padding:6px 12px;gap:8px;flex-wrap:wrap}
    header .sub{display:none}
    header h1{font-size:13px}
    .status{flex-basis:auto}
    main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .preview{border-right:none;border-bottom:1px solid var(--rule);height:34vh}
    .stage{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable}
    .preview.tall{height:62vh}
    .ptools .expand{display:inline-block}
    .flnote{display:none}
    .editor{padding:10px 12px 16px}
    .actbar{padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
    .actbar .who{flex-basis:100%}
    .actbar .role{margin-right:auto}
  }
  @media (min-width:821px){ .ptools .expand{display:none} }
  @media (prefers-reduced-motion:no-preference){ .faces button,.fld textarea{transition:border-color .15s,background .15s} }
  /* ===== デザイン：Material Design 3 の骨組み × モノトーン（案B）＋ 文字サイズの強弱 ===== */
  :root{ --rule:rgba(26,26,26,.22); --rule-soft:rgba(26,26,26,.22); --field:transparent; --bar:var(--bg); --ol:var(--ink); --rail:88px; }
  .ms,#saveBtn::before,#exportBtn::before,.okitem::before,#cmtBtn::before,#zoomText::before,#zoomPrint::before,#zoomAll::before,#mapBtn::before,.upd>summary::before{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:-4px;margin-right:6px}
  #saveBtn::before{content:'save'} #exportBtn::before{content:'content_copy'} .okitem::before{content:'check_circle'} .okitem.done::before{content:'task_alt'}
  #cmtBtn::before{content:'add_comment'} #zoomText::before{content:'text_fields'} #zoomPrint::before{content:'crop_free'} #zoomAll::before{content:'fit_screen'} #mapBtn::before{content:'map'} .upd>summary::before{content:'rate_review'}
  body{font-size:14px}
  button{border-radius:999px;border:.5px solid var(--ol);padding:7px 16px;font-size:13px;font-weight:400}
  button:hover{background:rgba(26,26,26,.08);color:inherit}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500;font-size:14px}
  button.primary:hover{background:#333;color:var(--bg)}
  button.primary[disabled]:hover{background:var(--ink);color:var(--bg)}
  header{min-height:56px;border-bottom:.5px solid var(--ol);padding:8px 20px 8px calc(var(--rail) + 16px)}
  header h1{font-size:15px;font-weight:400;letter-spacing:.04em}
  header .sub{font-size:11px}
  .view-switch{display:flex;gap:4px;align-items:center;flex:none}
  .view-switch button{font-size:12px;padding:5px 12px;border-color:var(--rule-soft)}
  .view-switch button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
  /* ナビゲーションレール（左） */
  .faces{position:fixed;left:0;top:0;bottom:0;width:var(--rail);flex-direction:column;align-items:center;gap:16px;padding:72px 0 16px;border-right:.5px solid var(--ol);overflow-y:auto;background:var(--bg);z-index:5}
  .faces button{width:56px;height:32px;min-width:0;border:none;border-radius:16px;padding:0;font-size:16px;flex:none}
  .faces button.on{background:var(--ink);color:var(--bg);border:none;font-weight:500}
  .faces button .u{bottom:-8px;border-radius:4px;background:var(--bg);border:.5px solid var(--ink);color:var(--ink)}
  .faces button .ok{position:absolute;top:-6px;right:0;font-size:11px}
  .faces .sep{width:40px;height:.5px;margin:4px 0;background:var(--ol)}
  main{margin-left:var(--rail)}
  .preview{border-right:.5px solid var(--ol)}
  .ptools{padding:8px 16px;gap:0;border-bottom:.5px solid var(--rule)}
  .ptools .name{font-size:12px;color:var(--ink-3)}
  .ptools button{height:32px;border-radius:0;border:.5px solid var(--ol);margin-left:-.5px;padding:0 12px;font-size:12px}
  .ptools #zoomText{border-radius:16px 0 0 16px} .ptools #zoomAll{border-radius:0 16px 16px 0} .ptools #expandBtn{border-radius:16px;margin-left:8px} .ptools #mapBtn{border-radius:16px;margin-left:8px}
  .ptools button.on{background:var(--ink);color:var(--bg)}
  /* 文字の強弱：面番号 ＞ 文言 ＞ 項目名 ＞ 補足 */
  .editor{padding:20px 24px 28px;gap:18px}
  .editor h2{display:flex;flex-direction:column;gap:4px;margin:0}
  .editor h2 .no{font-size:40px;line-height:44px;font-weight:300;letter-spacing:-.01em}
  .editor h2 .fn{font-size:15px;line-height:22px;font-weight:400;color:var(--ink-2)}
  .editor .prog{display:flex;align-items:baseline;gap:8px;margin-top:-4px;color:var(--ink-2)}
  .editor .prog .pl{font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
  .editor .prog .pn{font-size:13px} .editor .prog .pn b{font-size:26px;font-weight:300;color:var(--ink);margin-right:2px}
  .grp{border-top:1px solid var(--ol);padding-top:4px}
  .grp > .gl, .cmt .gl, details.memo summary{font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
  .fld{border-bottom:.3px solid var(--ol);padding:14px 0 10px;gap:6px}
  .fld .lab .nm{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.02em}
  .fld .lab .cnt{font-size:10px}
  .fld textarea{border:.5px solid var(--ol);border-radius:4px;background:transparent;padding:10px 14px;font-size:17px;line-height:1.7;color:var(--ink)}
  .fld textarea.big{font-size:20px}
  .fld textarea:focus{outline:none;border:1.5px solid var(--ol)}
  .fld .more summary{font-size:10px}

async function saveDraft(face){
  if (!state.db) { setMsg('共有保存に接続していません', 'err'); return false; }
  const l = state.local[face.no]; if (!l) return true;
  const texts = {}; const now = new Date().toISOString(); const entries = [];
  for (const t of face.texts) { const id = t[0]; if (l[id] != null && l[id] !== savedText(face, id)) { texts[id] = l[id]; entries.push({ at: now, by: whoName(), id, from: savedText(face, id), to: l[id] }); } }
  if (!entries.length) { delete state.local[face.no]; saveLocal(); return true; }
  const d = state.docs[face.no] || {};
  const log = (d.log || []).concat(entries).slice(-120);
  const body = { texts: Object.assign({}, d.texts || {}, texts), updatedAt: now, updatedBy: whoName(), log };
  try {
    await writeDoc(state.db.doc(docPath(face, 'faces')), body);
    state.docs[face.no] = Object.assign({}, d, { texts: Object.assign({}, d.texts || {}, texts), updatedAt: now, updatedBy: whoName(), log });
    delete state.local[face.no]; saveLocal();
    setMsg('保存しました ' + fmt(now), 'ok'); return true;
  } catch (e) { setMsg((e && e.code === 'invalid_argument') ? '保存できませんでした。このアカウントには書き込み権限がありません（閲覧のみ）。' : '保存できませんでした（' + ((e && e.code) || '') + '）', 'err'); return false; }
}

async function approveItem(face, id){

      if (!ch && !ck && !ok) continue;
      lines.push(`・${t[1]}［${id}］　専務:${ok ? (items[id].text === savedText(f, id) ? '✓' : '要再確認') : '－'}`);
      if (ch) lines.push(`　前：${baseText(f, id).replace(/\n/g,'／')}`, `　後：${savedText(f, id).replace(/\n/g,'／')}`);
    }
    for (const c of (d.comments || [])) lines.push(`　💬 ${c.by || ''} ${fmt(c.at)}：${c.text}`);
  }
  const s = lines.join('\n');
  try { await navigator.clipboard.writeText(s); setMsg('保存データをコピーしました。Claude に貼り付ければ Figma に反映できます', 'ok'); }
  catch (e) { window.prompt('以下をコピーしてください', s); }
});

/* ===== ブース平面図（什器列・背面 壁面・アイランド／上が背面、下が通路） ===== */
const MAP_MARK = { '3':[925,6330], '6':[2175,6330], '9':[3425,6330],
  '14':[978,-260], '15':[2326,-260], '16':[3678,-260], '17':[5026,-260],
  '21':[4700,3700], '22':[1300,3700] };
const ROLL_MAP_MARK = { '2':[520,4950], '4':[1330,4950], '5':[1770,4950], '7':[2580,4950], '8':[3020,4950], '10':[3830,4950] };
const MAP_NAME = {};
function renderMap(){
  const svg = $('#mapSvg'); if (!svg) return;
  const msig = state.view + '|' + state.cur + '|' + FACES.map(f => faceAllOk(f) ? 1 : 0).join(''); if (renderMap.last === msig && svg.childNodes.length) return; renderMap.last = msig;
  const r = (x,y,w,h,c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${c}"/>`;
  const tx = (x,y,s,c='lab',a='start') => `<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${esc(s)}</text>`;
  let g = '';
  if (state.view === 'roll') {
    svg.setAttribute('viewBox', '-700 4500 7400 2400');
    g += `<line x1="-600" y1="6000" x2="6600" y2="6000" class="thin"/>`;
    g += r(0,5400,250,600,'fill') + r(0,5400,250,600,'thin') + r(5750,5400,250,600,'fill') + r(5750,5400,250,600,'thin');
    [[300,'F'],[1550,'G'],[2800,'H']].forEach(([x,l]) => { g += r(x,5400,1250,600,'thin') + r(x+300,5400,650,600,'roll') + tx(x+625,5760,'什器 '+l,'lab b','middle'); });
    g += r(4450,5400,1200,600,'thin') + tx(5050,5760,'入口','lab','middle');
    g += tx(2200,6720,'通路（お客様はこちらから見る）','lab b','middle');
  } else {
    svg.setAttribute('viewBox', '-700 -750 7400 7500');
  g += r(0,0,6000,6000,'thin');                                                  // ブース 6000 角
  g += `<line x1="-600" y1="6000" x2="6600" y2="6000" class="thin"/>`;           // ブース前端
  // 背面 壁面 a〜d
  [[352,'a'],[1700,'b'],[3052,'c'],[4400,'d']].forEach(([x,l]) => {
    g += r(x,0,1252,300,'fill') + r(x,0,1252,300,'thin') + tx(x+626,200,'背面 '+l,'lab b','middle');
  });
  // 什器 F・G・H（通路側）
  g += r(0,5400,250,600,'fill') + r(0,5400,250,600,'thin') + r(5750,5400,250,600,'fill') + r(5750,5400,250,600,'thin');
  g += tx(125,6260,'柱a','lab','middle') + tx(5875,6260,'柱b','lab','middle');
  [[300,'F'],[1550,'G'],[2800,'H']].forEach(([x,l]) => { g += r(x,5400,1250,600,'thin') + r(x+300,5400,650,600,'roll') + tx(x+625,5760,'什器 '+l,'lab b','middle'); });
  g += r(4450,5400,1200,600,'thin') + tx(5050,5760,'入口','lab','middle');
  // アイランド 3 台ともぐくる
  g += r(1000,1400,600,600,'thin') + tx(1300,2230,'アイランド左上（カウンター役）','lab','middle') + tx(1300,2430,'展示物は置かない','lab','middle');
  g += r(1000,3400,600,600,'thin') + tx(1300,4230,'アイランド左下','lab','middle');
  g += r(4400,3400,600,600,'thin') + tx(4700,4230,'アイランド右下','lab','middle');
  g += tx(3000,6720,'通路（お客様はこちらから見る）','lab b','middle');
  }
  Object.entries(state.view === 'roll' ? ROLL_MAP_MARK : MAP_MARK).forEach(([no,[x,y]]) => {
    const f = faceOf(no); const on = no === state.cur;
    const cls = 'mk' + (f ? '' : ' ghost') + (on ? ' on' : '') + (f && faceAllOk(f) ? ' okd' : '');
    const title = f ? `${no}｜${f.name}` : `${no}（このページには未収録）`;
    g += `<g class="${cls}" data-no="${no}"><title>${esc(title)}</title><circle cx="${x}" cy="${y}" r="175"/><text x="${x}" y="${y}">${no}</text></g>`;
  });
  svg.innerHTML = g;
  svg.querySelectorAll('g.mk:not(.ghost)').forEach(el => el.addEventListener('click', () => selectFace(el.dataset.no)));
}

setStatus('保存先に接続中…');

/* ===== 共有保存（Firebase Realtime Database） ===== */
(function(){
  if (typeof firebase === 'undefined' || typeof FIREBASE_CONFIG === 'undefined' || !FIREBASE_CONFIG || !FIREBASE_CONFIG.databaseURL) {
    setStatus('保存先が未設定'); renderEditor(); return;
  }
  let fbdb;
  try { firebase.initializeApp(FIREBASE_CONFIG); fbdb = firebase.database(); }
  catch (e) { setStatus('保存先に接続できません'); renderEditor(); return; }
  const safeKey = id => String(id).replace(/[.#$\/\[\]]/g, '_');
  const flatten = (body) => {   // 1 段目のオブジェクトは子キーごとに書く（他の人の項目を消さないため）
    const out = {};
    for (const [k, v] of Object.entries(body)) {
      if (v && typeof v === 'object' && !Array.isArray(v) && ['texts','items','checks'].includes(k)) { for (const [id, val] of Object.entries(v)) out[k + '/' + safeKey(id)] = val; }
      else out[k] = v;
    }
    return out;
  };
  const unsafe = obj => obj;   // 表示側は安全化したキーのまま扱う（nodeId の ':' はそのまま使える）
  state.db = {
    doc: path => ({
      update: body => fbdb.ref(path).update(flatten(body)),
      set: body => fbdb.ref(path).update(flatten(body)),
      delete: () => fbdb.ref(path).remove(),
    }),
  };
  let raf = 0;
  const applyRender = () => {
    raf = 0;
    const active = document.activeElement; const editing = !!(active && active.dataset && active.dataset.id);
    renderFaces(); renderPreview();
    if (editing || state.busy) { if (editorSig() !== renderEditor.last) state.pendingRender = true; }
    else if (editorSig() !== renderEditor.last) renderEditor();
  };
  // 非表示タブでは requestAnimationFrame が止まるため setTimeout で代替（戻ったときに古い表示のままにならないように）
  const schedule = () => { if (raf) return; raf = document.hidden ? setTimeout(applyRender, 0) : requestAnimationFrame(applyRender); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(); });
  const currentDocs = data => {
    const out = {};
    for (const f of EXHIBIT_FACES) if (data[f.no]) out[f.no] = data[f.no];
    for (const f of ROLL_FACES) if (data['roll-final-' + f.no]) out[f.no] = data['roll-final-' + f.no];
    return out;
  };
  fbdb.ref('faces').on('value', snap => { state.docs = currentDocs(unsafe(snap.val() || {})); setStatus('接続済み'); schedule(); }, () => setStatus('接続が切れました'));
  fbdb.ref('approvals').on('value', snap => { state.approvals = currentDocs(unsafe(snap.val() || {})); schedule(); });
  fbdb.ref('meta/baseline').on('value', snap => { state.baseline = snap.val() || null; schedule(); });
  fbdb.ref('.info/connected').on('value', snap => { if (snap.val() === false) setStatus('オフライン（再接続待ち）'); });
  renderEditor();
})();
</script>
