  html{color-scheme:light}
  :root{

    --roll:#f6f4ee; --stage:#d9d9d4; --soil:#3d3026; --bag:#ede5d6;

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1c1a; --ink:#edede8; --ink-2:#c2c2bb; --ink-3:#8c8c85; --rule:#edede8;
      --rule-soft:rgba(237,237,232,.28); --field:#2a2a27; --bar:#262624;
      --ok:#8fd19b; --warn:#f0a56a; --err:#f08a84;
    }
  }

  html,body{height:100%}

  button{background:none;border:1px solid var(--rule);border-radius:0;padding:5px 12px;cursor:pointer;line-height:1.4;white-space:nowrap}

  button.primary:hover{background:var(--ink);color:var(--bg)}

  header{border-bottom:1px solid var(--rule);padding:6px 16px;display:flex;gap:14px;align-items:center;flex:none;min-height:var(--hdr)}

  .status{font-size:11px;color:var(--ink-3);text-align:right;white-space:nowrap}

  .map svg{width:100%;height:auto;max-height:100%;display:block;color:var(--ink)}

  .map .thin{fill:none;stroke:currentColor;stroke-width:8;opacity:.55}
  .map .fill{fill:currentColor;opacity:.12;stroke:none}
  .map .roll{fill:var(--roll);stroke:currentColor;stroke-width:10}
  .map .lab{font-size:150px;fill:currentColor;opacity:.7;font-weight:300}
  .map .lab.b{font-size:170px;opacity:.9;font-weight:400}
  .map .mk{cursor:pointer}
  .map .mk circle{fill:var(--bg);stroke:currentColor;stroke-width:22}

  .stage{flex:1;position:relative;overflow:hidden;background:var(--bg);min-height:0}
  body.fonts-loading .frame{visibility:hidden}
  .scroller{position:relative;overflow:hidden}

  .frame .r{position:absolute;border:0 solid #1a1a1a}

  .flnote{position:absolute;right:0;bottom:0;text-align:right;padding:2px 10px;font-size:10px;color:var(--ink-3);pointer-events:none;background:var(--bg)}
  .stage{contain:size layout}

  .edcol{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;contain:size layout}
  .editor{flex:1;overflow:auto;padding:12px 16px 24px;min-width:0;display:flex;flex-direction:column;gap:12px}

  .editor h2 small{display:block;font-size:11px;color:var(--ink-3);font-weight:300}

  details.memo summary{cursor:pointer;list-style:none}

  .fld .lab .meta{color:var(--ink-3);font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fld textarea{width:100%;background:var(--field);border:1px solid var(--rule-soft);padding:6px 8px;resize:vertical;min-height:38px;line-height:1.6;font-size:16px}
  .fld textarea.big{font-family:"Noto Serif JP",serif;font-size:17px}
  .fld.diff textarea{border-color:var(--warn)}
  .fld.unsaved textarea{border-style:dashed;border-color:var(--ink)}
  .fld .fig{font-size:11px;color:var(--ink-3);font-weight:300;white-space:pre-wrap}
  .fld .fig b{font-weight:400;color:var(--warn)}
  .fld .fig button{font-size:10px;padding:0 6px;margin-left:6px;border-color:var(--rule-soft)}
  .apr .who{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .apr .p{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .apr .p .t{color:var(--ink-3);font-size:11px;font-weight:300}
  .apr .stale{color:var(--warn)}
  .apr .none{color:var(--ink-3);font-weight:300}
  .cmt{display:flex;flex-direction:column;gap:6px}
  .cmt .list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
  .cmt .c{border-left:2px solid var(--rule-soft);padding:2px 10px;font-size:12px}
  .cmt .c .h{color:var(--ink-3);font-size:11px;font-weight:300}
  .cmt .in{display:flex;gap:6px;align-items:flex-start}
  .cmt .in select,.actbar select{background:var(--field);border:1px solid var(--rule-soft);padding:6px 4px;font-size:13px}
  .faces button .cm{font-size:9px;margin-left:2px}
  .cmt .in textarea{flex:1;background:var(--field);border:1px solid var(--rule-soft);padding:6px 8px;min-height:38px;resize:vertical;font-size:16px}

  .actbar{flex:none;border-top:1px solid var(--rule);background:var(--bar);padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  .actbar label{font-size:11px;color:var(--ink-2);white-space:nowrap}

  .actbar .role{display:flex;border:1px solid var(--rule-soft)}
  .actbar .role button{border:none;padding:4px 10px;font-size:12px}
  .actbar .role button.on{background:var(--ink);color:var(--bg)}
  .actbar .msg{flex-basis:100%;font-size:11px;color:var(--ink-3);font-weight:300;min-height:1.2em}
  .actbar .msg.err{color:var(--err)} .actbar .msg.ok{color:var(--ok)}
  .busy{pointer-events:none;opacity:.6}

  @media (max-width:820px){
    body{font-size:13px}
    .map{max-height:120px}
    .preview.tall{height:78vh}
    header{padding:6px 12px;gap:8px;flex-wrap:wrap}
    header .sub{display:none}
    header h1{font-size:13px}
    .status{flex-basis:auto}
    main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .preview{border-right:none;border-bottom:1px solid var(--rule);height:34vh}
    .stage{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable}
    .preview.tall{height:62vh}
    .ptools .expand{display:inline-block}
    .flnote{display:none}
    .editor{padding:10px 12px 16px}
    .actbar{padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
    .actbar .who{flex-basis:100%}
    .actbar .role{margin-right:auto}
  }

  @media (prefers-reduced-motion:no-preference){ .faces button,.fld textarea{transition:border-color .15s,background .15s} }
</style>

<body>
<header>
  <div><h1>SCAJ2026 ロール文言レビュー</h1><div class="sub">修正・確認・コメントは自動で共有され、開いている全員にリアルタイム反映（ログイン不要）</div></div>
  <nav class="faces" id="faces" aria-label="面の切り替え"></nav>
  <div class="status" id="status">読み込み中</div>
</header>

<main>
  <section class="preview" id="previewPane" aria-label="プレビュー">
    <div class="ptools">
      <span class="name" id="pname"></span>
      <button id="zoomText" class="on" type="button">文字</button>
      <button id="zoomPrint" type="button">什器まわり</button>
      <button id="zoomAll" type="button">全体</button>
      <button id="expandBtn" class="expand" type="button">拡大</button>
      <button id="mapBtn" class="on" type="button">図面</button>
    </div>
    <div class="map" id="mapPane"><svg id="mapSvg" viewBox="-620 4500 7300 2400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ブース平面図：面の位置"></svg></div>
    <div class="stage" id="stage"><div class="scroller" id="scroller"><div class="frame" id="frame"></div></div><div class="flnote" id="flnote"></div></div>
  </section>
  <section class="edcol">
    <div class="editor" id="editor" aria-label="文言の編集"></div>
    <div class="actbar" id="actbar">
      <div class="who">
        <label for="myname">名前</label><select id="myname"><option>専務</option><option>荻野</option><option>スタッフ</option></select>
        
      </div>
      <button type="button" id="saveBtn" class="primary">保存</button>
      <button type="button" id="exportBtn" title="Figma 反映用に、保存済みの文言・確認・コメントをテキストでコピー">Figma 反映用にコピー</button>
      
      <div class="msg" id="actmsg"></div>
    </div>
  </section>
</main>

const CROP = { text:{ roll:[1900,2620], outer:[1840,2620], disp:[2700,3300], island:[225,395] }, print:{ roll:[1150,3250], outer:[1150,3960], disp:[2700,4000], island:[210,810] } };
const FONT = { sans:'"Noto Sans JP",sans-serif', serif:'"Noto Serif JP",serif', hand:'"Segoe Script","Bradley Hand",cursive' };

/* ===== 状態 ===== */
const $ = (s, el=document) => el.querySelector(s);
const state = {
  cur: '2', zoom: 'text', role: 'staff', myname: '',
  docs: {},        // faces/{no}      → {texts, updatedAt, updatedBy, comments, log}
  approvals: {},   // approvals/{no}  → {items:{nodeId:{ok, by, at, text, figma, error, syncedAt}}}
  baseline: null,  // meta/baseline   → {texts:{nodeId:string}} Figma に最後に反映した文言
  local: {},       // 未保存の編集 {no:{nodeId:text}}
  db: null, focusId: null, pendingRender: false, busy: false,
};
try { const n = localStorage.getItem('scaj_myname'); state.myname = ['専務','荻野','スタッフ'].includes(n) ? n : '専務'; } catch(e){ state.myname = '専務'; }
try { const r = localStorage.getItem('scaj_role'); state.role = ['exec','ogino'].includes(r) ? r : 'staff'; } catch(e){}
try { const z = localStorage.getItem('scaj_zoom'); if (z && ['text','print','all'].includes(z)) state.zoom = z; } catch(e){}
try { const f = localStorage.getItem('scaj_face'); if (f && FACES.some(x=>x.no===f)) state.cur = f; } catch(e){}
try { const l = JSON.parse(localStorage.getItem('scaj_local') || '{}'); if (l && typeof l === 'object') state.local = l; } catch(e){}

const faceOf = no => FACES.find(f => f.no === no);
const figmaText = (face, id) => face.texts.find(t => t[0] === id)[12];
const baseText = (face, id) => (state.baseline && state.baseline.texts && state.baseline.texts[id] != null) ? state.baseline.texts[id] : figmaText(face, id);
const savedText = (face, id) => { const d = state.docs[face.no]; return (d && d.texts && d.texts[id] != null) ? d.texts[id] : baseText(face, id); };
const curText = (face, id) => { const l = state.local[face.no]; return (l && l[id] != null) ? l[id] : savedText(face, id); };
const hasUnsaved = face => { const l = state.local[face.no]; return !!l && Object.keys(l).some(id => l[id] !== savedText(face, id)); };
const hasDiff = face => face.texts.some(t => savedText(face, t[0]) !== baseText(face, t[0]));   // Figma に未反映
const itemOf = (face, id) => { const a = state.approvals[face.no]; const it = a && a.items && a.items[id]; return (it && it.ok) ? it : null; };
const itemStale = (face, id) => { const it = itemOf(face, id); return !!it && it.text !== savedText(face, id); };
const itemState = (face, id) => { const it = itemOf(face, id); if (!it) return 'none'; if (itemStale(face, id)) return 'stale'; return it.figma === 'synced' ? 'synced' : (it.figma === 'error' ? 'error' : 'pending'); };
const checkOf = (face, id) => { const a = state.approvals[face.no]; const c = a && a.checks && a.checks[id]; return (c && c.ok) ? c : null; };
const checkState = (face, id) => { const c = checkOf(face, id); if (!c) return 'none'; return c.text !== savedText(face, id) ? 'stale' : 'ok'; };
const printedIds = face => face.texts.filter(t => t[11]).map(t => t[0]);
const faceAllChecked = face => { const ids = printedIds(face); return ids.length > 0 && ids.every(id => checkState(face, id) === 'ok'); };
const faceAllOk = face => { const ids = printedIds(face); return ids.length > 0 && ids.every(id => ['synced','pending','error'].includes(itemState(face, id))); };
const pendingItems = face => face.texts.map(t => t[0]).filter(id => ['pending','error'].includes(itemState(face, id)));
const fmt = iso => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const saveLocal = () => { try { localStorage.setItem('scaj_local', JSON.stringify(state.local)); } catch(e){} };
const isNarrow = () => window.innerWidth <= 820;
const k = id => id.replace(':','_');
const whoName = () => state.myname || '専務';

/* ===== 面セレクタ ===== */
function facesSig(){ return FACES.map(f => [f.no === state.cur ? 1 : 0, faceAllOk(f) ? 1 : 0, faceAllChecked(f) ? 1 : 0, (hasDiff(f) || hasUnsaved(f)) ? 1 : 0, (state.docs[f.no] && state.docs[f.no].comments && state.docs[f.no].comments.length) ? 1 : 0].join('')).join(','); }
function renderFaces(){
  const sig = facesSig(); if (renderFaces.last === sig) return; renderFaces.last = sig;
  const nav = $('#faces'); nav.innerHTML = '';
  FACES.forEach((f, i) => {
    if (f.kind === 'island' && i > 0 && FACES[i-1].kind !== 'island') { const s = document.createElement('span'); s.className='sep'; nav.appendChild(s); }
    const b = document.createElement('button'); b.type='button'; b.textContent = f.no; b.title = f.name;
    if (f.no === state.cur) b.classList.add('on');
    if (faceAllOk(f)) { const ok = document.createElement('span'); ok.className='ok'; ok.textContent = '✓'; ok.title='専務 確認済'; b.appendChild(ok); }
    else if (faceAllChecked(f)) { const ok = document.createElement('span'); ok.className='ok half'; ok.textContent = '✓'; ok.title='荻野 確認済'; b.appendChild(ok); }
    if (hasDiff(f) || hasUnsaved(f)) { const c = document.createElement('span'); c.className='chg'; c.title = hasUnsaved(f) ? '未保存の編集あり' : 'Figma に未反映の変更あり'; b.appendChild(c); }
    { const d = state.docs[f.no]; if (d && d.comments && d.comments.length) { const c = document.createElement('span'); c.className='cm'; c.textContent = '💬'; c.title='コメントあり'; b.appendChild(c); } }
    b.addEventListener('click', () => selectFace(f.no));
    nav.appendChild(b);
  });
  const on = nav.querySelector('button.on'); if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'nearest'});
  if (typeof renderMap === 'function' && $('#mapSvg') && $('#mapSvg').childNodes.length) renderMap();
}
function selectFace(no){ state.cur = no; state.focusId = null; try{ localStorage.setItem('scaj_face', no); }catch(e){}; renderAll(); $('#editor').scrollTop = 0; }

/* ===== プレビュー ===== */
function previewSig(face){ return [face.no, state.focusId, face.texts.map(x => curText(face, x[0])).join('\u0001')].join('|'); }
function renderPreview(){
  const face = faceOf(state.cur);
  const psig = previewSig(face); if (renderPreview.last === psig) { fitPreview(); return; } renderPreview.last = psig;
  const fr = $('#frame'); fr.innerHTML = '';
  fr.style.width = face.w + 'px'; fr.style.height = face.h + 'px'; fr.style.background = FRAME_BG;
  const fillOf = kk => ({ roll:'var(--roll)', stage:'var(--stage)', soil:'var(--soil)', bag:'var(--bag)' })[kk] || 'transparent';
  for (const r of RECTS[face.kind]) {
    const [kind,x,y,w,h,fill,sw,name] = r;
    const el = document.createElement('div'); el.className='r'; el.title = name;
    el.style.left = x+'px'; el.style.top = y+'px'; el.style.width = w+'px';
    el.style.height = (kind==='l' ? 0 : h) + 'px';
    el.style.background = fillOf(fill);
    if (kind === 'e') el.style.borderRadius = '50%';
    if (kind === 'l') { el.style.borderTopWidth = sw+'px'; } else { el.style.borderWidth = sw+'px'; }
    if (name === '印刷範囲') { el.style.borderStyle = 'dashed'; el.style.opacity = .5; }
    fr.appendChild(el);
  }
  for (const t of face.texts) {
    const [id,name,x,y,w,font,weight,size,lh,align,color] = t;
    const el = document.createElement('p'); el.className = 't'; el.dataset.id = id; el.title = name;
    el.style.left = x+'px'; el.style.top = y+'px'; el.style.width = w+'px';
    el.style.fontFamily = FONT[font]; el.style.fontWeight = weight; el.style.fontSize = size+'px';
    el.style.lineHeight = (lh === 'auto') ? '1.45' : (lh/100).toString();
    el.style.textAlign = align; el.style.color = color;
    el.textContent = curText(face, id);
    if (state.focusId === id) el.classList.add('hl');
    el.addEventListener('click', () => { const ta = document.getElementById('ta-' + k(id)); if (ta) { ta.focus(); ta.scrollIntoView({block:'center', behavior:'smooth'}); } });
    fr.appendChild(el);
  }
  $('#pname').textContent = `${face.no}｜${face.name}`;
  ['text','print','all'].forEach(z => $('#zoom' + z[0].toUpperCase() + z.slice(1)).classList.toggle('on', state.zoom === z));
  $('#zoomPrint').textContent = face.kind === 'island' ? '600角' : '什器まわり';
  fitPreview();
}
function fitPreview(){
  const face = faceOf(state.cur); const st = $('#stage'); const sc = $('#scroller'); const fr = $('#frame');
  const rc = st.getBoundingClientRect(); const W = Math.floor(st.clientWidth) - 1, H = Math.floor(Math.min(rc.height, st.clientHeight)) - 1; if (W < 10 || H < 10) return;
  const sig = [face.no, state.zoom, W, H, isNarrow()].join('|'); if (fitPreview.last === sig) return; fitPreview.last = sig;
  let y0 = 0, y1 = face.h;
  if (CROP[state.zoom]) { [y0, y1] = CROP[state.zoom][face.kind]; }
  let s = Math.min(W / face.w, H / (y1 - y0));
  if (isNarrow() && state.zoom !== 'all') s = W / face.w;   // スマホは幅いっぱい・範囲内を上下スクロール
  const ch = (y1 - y0) * s;
  sc.style.width = W + 'px'; sc.style.height = (isNarrow() && state.zoom !== 'all' ? Math.max(ch, H) : H) + 'px';
  fr.style.transform = `scale(${s})`;
  fr.style.left = Math.max(0, (W - face.w*s)/2) + 'px';
  fr.style.top = (-y0*s + Math.max(0, (H - ch)/2)) + 'px';
  $('#flnote').textContent = (face.kind === 'island' ? 'アイランド 600角' : 'ロール幅 600・FL = 通路床基準') + `　1px = 1mm　縮尺 ${(s*100).toFixed(0)}%`;
}
new ResizeObserver(fitPreview).observe($('#stage'));
[['zoomText','text'],['zoomPrint','print'],['zoomAll','all']].forEach(([id,z]) => $('#'+id).addEventListener('click', () => { state.zoom = z; try{localStorage.setItem('scaj_zoom', z)}catch(e){}; renderPreview(); }));
$('#expandBtn').addEventListener('click', () => { const p = $('#previewPane'); p.classList.toggle('tall'); $('#expandBtn').textContent = p.classList.contains('tall') ? '縮小' : '拡大'; });

/* ===== エディタ ===== */
function editorSig(){ const no = state.cur; return JSON.stringify([no, state.docs[no] || null, state.approvals[no] || null, state.baseline || null, state.local[no] || null, state.myname, state.db ? 1 : 0, state.busy ? 1 : 0]); }
function renderEditor(){
  const face = faceOf(state.cur); const ed = $('#editor');
  renderEditor.last = editorSig();
  const doc = state.docs[face.no] || {};
  const printed = face.texts.filter(t => t[11]); const memos = face.texts.filter(t => !t[11]);
  const unsaved = hasUnsaved(face); const diff = hasDiff(face); const pend = pendingItems(face);
  const ids = printedIds(face); const okCount = ids.filter(id => ['synced','pending','error'].includes(itemState(face, id))).length;
  let badges = '';
  if (unsaved) badges += '<span class="badge warn">未保存</span>';
  const chkCount = ids.filter(id => checkState(face, id) === 'ok').length;
  if (ids.length) badges += `<span class="badge ${chkCount === ids.length ? 'ok' : ''}">荻野 確認 ${chkCount}／${ids.length}</span><span class="badge ${okCount === ids.length ? 'ok' : ''}">専務 確認 ${okCount}／${ids.length}</span>`;
  if (diff) badges += '<span class="badge warn">Figma に未反映</span>';
  else badges += '<span class="badge ok">Figma と同じ</span>';
  let html = `<h2>面 ${face.no}｜${esc(face.name)}${badges}<small>Figma フレーム ${face.id}${doc.updatedAt ? `　保存 ${fmt(doc.updatedAt)}${doc.updatedBy ? '（'+esc(doc.updatedBy)+'さん）' : ''}` : ''}</small></h2>`;
  if (!state.db) html += `<div class="offline">保存先（Firebase）に接続していません。firebase-config.js の設定を確認してください。編集内容はこの端末だけに残ります。</div>`;
  const log = doc.log || [];
  const fld = (t, memo) => {
    const [id,name,,,w,font,,size] = t;
    const v = curText(face, id); const b = baseText(face, id); const sv = savedText(face, id);
    const changed = sv !== b; const dirty = v !== sv; const big = size >= 30;
    const it = itemOf(face, id); const stt = itemState(face, id);
    const last = [...log].reverse().find(e => e.id === id);
    const ck = checkOf(face, id); const cst = checkState(face, id);
    let ckrow = cst === 'none' ? `<span class="st none">荻野 確認なし</span>` : cst === 'stale' ? `<span class="st stale">確認後に変更あり（荻野 ${fmt(ck.at)} の確認は「${esc(ck.text)}」）</span>` : `<span class="st ok">荻野 確認 ${fmt(ck.at)}</span>`;
    let okrow = '';
    if (stt === 'none') okrow = `<span class="st none">専務 確認なし</span>`;
    else if (stt === 'stale') okrow = `<span class="st stale">確認後に変更あり（専務 ${fmt(it.at)} の確認は「${esc(it.text)}」）</span>`;
    else if (stt === 'synced') okrow = `<span class="st ok">専務 確認 ${fmt(it.at)}　Figma 反映済 ${fmt(it.syncedAt)}</span>`;
    else if (stt === 'error') okrow = `<span class="st ok">専務 確認 ${fmt(it.at)}</span>`;
    else okrow = `<span class="st ok">専務 確認 ${fmt(it.at)}</span>`;
    const can = state.db && !state.busy;
    const ckBtn = (cst === 'none' || cst === 'stale')
      ? `<button type="button" class="okitem chk" data-chk="${id}" ${can ? '' : 'disabled'}>荻野 ${cst === 'stale' ? '再確認' : '確認'}</button>`
      : `<button type="button" class="okitem chk done" data-unchk="${id}" ${state.db && !state.busy ? '' : 'disabled'} title="押すと確認を取り消します">荻野 ✓</button>`;
    const okBtn = (stt === 'none' || stt === 'stale')
      ? `<button type="button" class="okitem" data-ok="${id}" ${can ? '' : 'disabled'}>専務 ${stt === 'stale' ? '再確認' : '確認'}</button>`
      : `<button type="button" class="okitem done" data-unok="${id}" ${state.db && !state.busy ? '' : 'disabled'} title="押すと確認を取り消します">専務 ✓</button>`;
    const okbtn = `<span class="btns">${ckBtn}${okBtn}</span>`;
    return `<div class="fld${changed ? ' diff' : ''}${dirty ? ' unsaved' : ''} s-${stt}">
      <div class="lab"><span>${esc(name)}${dirty ? '<span class="badge warn">未保存</span>' : ''}</span><span class="meta">${font==='serif'?'明朝':font==='hand'?'手書き体':'ゴシック'} ${size}px／幅 ${w}　<span id="cnt-${k(id)}">${v.replace(/\n/g,'').length}</span> 字</span></div>
      <textarea id="ta-${k(id)}" data-id="${id}" rows="${Math.max(1, Math.min(8, v.split('\n').length + (v.length > 40 ? 2 : 0)))}" class="${big?'big':''}" spellcheck="false">${esc(v)}</textarea>
      ${memo ? '' : `<div class="okrow"><span class="stack">${ckrow}${okrow}</span>${okbtn}</div>`}
      ${changed ? `<div class="fig">Figma 現在：<b>${esc(b)}</b><button type="button" data-revert="${id}">Figma の文言に戻す</button></div>` : ''}
      ${last && last.from !== undefined ? `<div class="fig">変更：${esc(last.by)}さん ${fmt(last.at)}　前「${esc(last.from)}」</div>` : ''}
    </div>`;
  };
  html += `<div class="grp"><div class="gl">印刷される文言</div>${printed.length ? printed.map(t => fld(t, false)).join('') : '<div class="note">この面のロールは無地刷り。文字は入れず、現物と札で見せる面です。</div>'}</div>`;
  if (memos.length) html += `<details class="grp memo"><summary class="gl">Figma 上のメモ（印刷されない注記：展示物の内容・無地範囲の目印）— 開く</summary><div class="note">ロール本体には印刷されない、図面用の注記です。確認ボタンは付けていません。</div>${memos.map(t => fld(t, true)).join('')}</details>`;

  const cs = (doc.comments || []);
  html += `<div class="grp cmt"><div class="gl">この面へのコメント（「もっと短く」など）</div>
    <div class="list">${cs.length ? cs.map(c => `<div class="c"><div class="h">${esc(c.by)}　${fmt(c.at)}</div><div>${esc(c.text)}</div></div>`).join('') : '<span class="note">コメントはまだありません</span>'}</div>
    <div class="in"><textarea id="cmtIn" placeholder="例：説明文をもう 2 行短く" ${state.db ? '' : 'disabled'}></textarea><button type="button" id="cmtBtn" ${state.db ? '' : 'disabled'}>追加</button></div>
  </div>`;
  html += `<div class="note">編集したら下の「保存」で全員に共有されます（保存前は点線枠）。橙の枠は Figma に未反映の文言。各文言の右の「荻野 確認」「専務 確認」はボタンを押すだけで記録されます（未保存の編集があれば自動で保存してから記録）。確認後に文言が変わった欄は再確認が必要です。Figma への反映は Claude が別途行います。<br>← → キーで面を切り替え。プレビューの文字をタップすると該当欄に移動します。</div>`;
  ed.innerHTML = html;

  ed.querySelectorAll('textarea[data-id]').forEach(ta => {
    ta.addEventListener('input', () => onEdit(face, ta.dataset.id, ta.value));
    ta.addEventListener('focus', () => { state.focusId = ta.dataset.id; renderPreview(); });
  });
  ed.querySelectorAll('button[data-revert]').forEach(b => b.addEventListener('click', () => { const id = b.dataset.revert; onEdit(face, id, baseText(face, id)); renderEditor(); }));
  ed.querySelectorAll('button[data-ok]').forEach(b => b.addEventListener('click', () => approveItem(face, b.dataset.ok)));
  ed.querySelectorAll('button[data-chk]').forEach(b => b.addEventListener('click', () => checkItem(face, b.dataset.chk)));
  ed.querySelectorAll('button[data-unchk]').forEach(b => b.addEventListener('click', () => uncheckItem(face, b.dataset.unchk)));
  ed.querySelectorAll('button[data-unok]').forEach(b => b.addEventListener('click', () => unapproveItem(face, b.dataset.unok)));
  const cb = $('#cmtBtn'); if (cb) cb.addEventListener('click', () => addComment(face));
  renderActbar();
}
function onEdit(face, id, value){
  if (!state.local[face.no]) state.local[face.no] = {};
  if (value === savedText(face, id)) delete state.local[face.no][id]; else state.local[face.no][id] = value;
  if (!Object.keys(state.local[face.no]).length) delete state.local[face.no];
  saveLocal();
  const p = $(`#frame .t[data-id="${id}"]`); if (p) p.textContent = value;
  const c = document.getElementById('cnt-'+k(id)); if (c) c.textContent = value.replace(/\n/g,'').length;
  const ta = document.getElementById('ta-'+k(id));
  if (ta) { const f = ta.closest('.fld'); f.classList.toggle('unsaved', value !== savedText(face, id)); f.classList.toggle('diff', value !== baseText(face, id)); }
  renderActbar(); renderFaces();
}

/* ===== 操作バー ===== */
function renderActbar(){
  const face = faceOf(state.cur); const unsaved = hasUnsaved(face);
  const save = $('#saveBtn'); save.disabled = !(state.db && unsaved) || state.busy;
  save.textContent = unsaved ? '保存' : '保存済み';
}
function setMsg(text, kind){ const m = $('#actmsg'); m.textContent = text || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
function setStatus(s){ $('#status').textContent = s; }
async function writeDoc(ref, body){ try { await ref.update(body); } catch (e) { if (e && e.code === 'invalid_argument') await ref.set(body); else throw e; } }

async function saveDraft(face){
  if (!state.db) { setMsg('共有保存に接続していません', 'err'); return false; }
  const l = state.local[face.no]; if (!l) return true;
  const texts = {}; const now = new Date().toISOString(); const entries = [];
  for (const t of face.texts) { const id = t[0]; if (l[id] != null && l[id] !== savedText(face, id)) { texts[id] = l[id]; entries.push({ at: now, by: whoName(), id, from: savedText(face, id), to: l[id] }); } }
  if (!entries.length) { delete state.local[face.no]; saveLocal(); return true; }
  const d = state.docs[face.no] || {};
  const log = (d.log || []).concat(entries).slice(-120);
  const body = { texts, updatedAt: now, updatedBy: whoName(), log };
  try {
    await writeDoc(state.db.doc('faces/' + face.no), body);
    state.docs[face.no] = Object.assign({}, d, { texts: Object.assign({}, d.texts || {}, texts), updatedAt: now, updatedBy: whoName(), log });
    delete state.local[face.no]; saveLocal();
    setMsg('保存しました ' + fmt(now), 'ok'); return true;
  } catch (e) { setMsg((e && e.code === 'invalid_argument') ? '保存できませんでした。このアカウントには書き込み権限がありません（閲覧のみ）。' : '保存できませんでした（' + ((e && e.code) || '') + '）', 'err'); return false; }
}

/* ===== 専務 確認（文言ごと） ===== */
async function approveItem(face, id){
  if (state.busy) return;
  if (!state.db) { setMsg('共有保存に接続していません', 'err'); return; }
  state.busy = true; renderActbar(); $('#actbar').classList.add('busy');
  try {
    if (hasUnsaved(face)) { const ok = await saveDraft(face); if (!ok) return; }
    const rec = { ok: true, by: '専務', at: new Date().toISOString(), text: savedText(face, id), figma: 'pending', error: '', syncedAt: '' };
    const aref = state.db.doc('approvals/' + face.no);
    try { await writeDoc(aref, { items: { [id]: rec } }); }
    catch (e) {
      setMsg((e && e.code === 'invalid_argument') ? '確認を記録できませんでした。このページの編集権限が必要です。' : '確認を記録できませんでした（' + ((e && e.code) || '') + '）', 'err');
      return;
    }
    const a = state.approvals[face.no] || {}; a.items = Object.assign({}, a.items || {}, { [id]: rec }); state.approvals[face.no] = a;
    setMsg('専務 確認を記録しました', 'ok');
  } finally { state.busy = false; $('#actbar').classList.remove('busy'); renderFaces(); renderEditor(); }
}
async function checkItem(face, id){
  if (state.busy) return;
  if (!state.db) { setMsg('共有保存に接続していません', 'err'); return; }
  state.busy = true; renderActbar(); $('#actbar').classList.add('busy');
  try {
    if (hasUnsaved(face)) { const ok = await saveDraft(face); if (!ok) return; }
    const rec = { ok: true, by: '荻野', at: new Date().toISOString(), text: savedText(face, id) };
    try { await writeDoc(state.db.doc('approvals/' + face.no), { checks: { [id]: rec } }); }
    catch (e) { setMsg((e && e.code === 'invalid_argument') ? '確認を記録できませんでした。確認・OK はページの編集権限がある方のみ記録できます。' : '確認を記録できませんでした（' + ((e && e.code) || '') + '）', 'err'); return; }
    const a = state.approvals[face.no] || {}; a.checks = Object.assign({}, a.checks || {}, { [id]: rec }); state.approvals[face.no] = a;
    setMsg('荻野 確認を記録しました', 'ok');
  } finally { state.busy = false; $('#actbar').classList.remove('busy'); renderFaces(); renderEditor(); }
}
async function uncheckItem(face, id){
  if (!state.db || state.busy) return;
  try {
    await state.db.doc('approvals/' + face.no).update({ checks: { [id]: { ok: false } } });
    const a = state.approvals[face.no]; if (a && a.checks && a.checks[id]) a.checks[id] = { ok: false };
    setMsg('確認を取り消しました', 'ok'); renderFaces(); renderEditor();
  } catch (e) { setMsg((e && e.code === 'invalid_argument') ? '取り消しは編集権限のある方のみ行えます' : '取り消せませんでした', 'err'); }
}
async function unapproveItem(face, id){
  if (!state.db || state.busy) return;
  try {
    await state.db.doc('approvals/' + face.no).update({ items: { [id]: { ok: false } } });
    const a = state.approvals[face.no]; if (a && a.items && a.items[id]) a.items[id] = { ok: false };
    setMsg('確認を取り消しました', 'ok'); renderFaces(); renderEditor();
  } catch (e) { setMsg((e && e.code === 'invalid_argument') ? '取り消しには編集権限が必要です' : '取り消せませんでした', 'err'); }
}
async function addComment(face){
  const ta = $('#cmtIn'); const text = (ta.value || '').trim(); if (!text || !state.db) return;
  const doc = state.docs[face.no] || {}; const list = (doc.comments || []).slice(-199);
  list.push({ by: whoName(), at: new Date().toISOString(), text });
  try { await writeDoc(state.db.doc('faces/' + face.no), { comments: list }); ta.value=''; setMsg('コメントを送信しました', 'ok'); }
  catch(e){ setMsg('送信できませんでした', 'err'); }
}

/* ===== イベント ===== */
$('#exportBtn').addEventListener('click', async () => {
  const lines = ['【SCAJ2026 ロール文言 保存データ】' + new Date().toLocaleString('ja-JP')];
  for (const f of FACES) {
    const d = state.docs[f.no] || {}; const a = state.approvals[f.no] || {};
    const changed = f.texts.filter(t => savedText(f, t[0]) !== baseText(f, t[0]));
    const items = a.items || {}, checks = a.checks || {};
    const anyMark = Object.values(items).some(x => x && x.ok) || Object.values(checks).some(x => x && x.ok);
    if (!changed.length && !anyMark && !(d.comments && d.comments.length)) continue;
    lines.push('', `■ 面 ${f.no}｜${f.name}`);
    for (const t of f.texts) {
      const id = t[0]; const ch = savedText(f, id) !== baseText(f, id); const ck = checks[id] && checks[id].ok, ok = items[id] && items[id].ok;
      if (!ch && !ck && !ok) continue;
      lines.push(`・${t[1]}［${id}］　荻野:${ck ? (checks[id].text === savedText(f, id) ? '✓' : '要再確認') : '－'}　専務:${ok ? (items[id].text === savedText(f, id) ? '✓' : '要再確認') : '－'}`);
      if (ch) lines.push(`　前：${baseText(f, id).replace(/\n/g,'／')}`, `　後：${savedText(f, id).replace(/\n/g,'／')}`);
    }
    for (const c of (d.comments || [])) lines.push(`　💬 ${c.by || ''} ${fmt(c.at)}：${c.text}`);
  }
  const s = lines.join('\n');
  try { await navigator.clipboard.writeText(s); setMsg('保存データをコピーしました。Claude に貼り付ければ Figma に反映できます', 'ok'); }
  catch (e) { window.prompt('以下をコピーしてください', s); }
});
$('#saveBtn').addEventListener('click', () => saveDraft(faceOf(state.cur)).then(() => { renderFaces(); renderEditor(); }));
const nameIn = $('#myname'); nameIn.value = state.myname;
nameIn.addEventListener('change', () => { state.myname = nameIn.value; try{ localStorage.setItem('scaj_myname', state.myname); }catch(e){}; });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  const i = FACES.findIndex(f => f.no === state.cur);
  if (e.key === 'ArrowRight' && i < FACES.length-1) selectFace(FACES[i+1].no);
  if (e.key === 'ArrowLeft' && i > 0) selectFace(FACES[i-1].no);
});
window.addEventListener('resize', fitPreview);
document.addEventListener('focusout', e => {
  if (state.pendingRender && e.target && e.target.dataset && e.target.dataset.id) {
    state.pendingRender = false; setTimeout(() => { const a = document.activeElement; if (!(a && a.dataset && a.dataset.id)) renderEditor(); }, 250);
  }
});

/* ===== ロール部分の平面図（通路側の什器列だけ・上が什器、下が通路） ===== */
const MAP_MARK = { '1':[-330,5150], '2':[520,4950], '3':[925,6330], '4':[1330,4950], '5':[1770,4950], '6':[2175,6330], '7':[2580,4950], '8':[3020,4950], '9':[3425,6330], '10':[3830,4950], '11':[4360,4950],
  '12':[6380,6330], '13':[6380,4950], '19':[-330,5850], '21':[5100,4950] };
const MAP_NAME = { '12':'帯②｜通路から見える面', '13':'帯②｜ブース内から見える面', '19':'柱 木目部｜原紙サンプル' };
function renderMap(){
  const svg = $('#mapSvg'); if (!svg) return;
  const msig = state.cur + '|' + FACES.map(f => faceAllOk(f) ? 1 : 0).join(''); if (renderMap.last === msig && svg.childNodes.length) return; renderMap.last = msig;
  const r = (x,y,w,h,c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${c}"/>`;
  const tx = (x,y,s,c='lab',a='start') => `<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${esc(s)}</text>`;
  let g = '';
  g += `<line x1="-600" y1="6000" x2="6500" y2="6000" class="thin"/>`;            // ブース前端
  g += r(0,5400,250,600,'fill') + r(0,5400,250,600,'thin') + r(5750,5400,250,600,'fill') + r(5750,5400,250,600,'thin');
  g += tx(125,6260,'柱a','lab','middle') + tx(5875,6260,'柱b','lab','middle');
  [[300,'F'],[1550,'G'],[2800,'H']].forEach(([x,l]) => { g += r(x,5400,1250,600,'thin') + r(x+300,5400,650,600,'roll') + tx(x+625,5760,'什器 '+l,'lab b','middle'); });
  [275,1550,2800,4075].forEach(x => { g += `<circle cx="${x}" cy="5700" r="60" class="ln"/>`; });
  [300,1525,1550,2775,2800,4025,225,4110].forEach(x => { g += r(x,5400,25,600,'fill'); });
  g += r(5690,5400,25,600,'fill') + tx(5702,5330,'帯②','lab','middle');
  g += r(4450,5400,1200,600,'thin') + tx(5050,5760,'入口','lab','middle');
  g += tx(2200,6720,'通路（お客様はこちらから見る）','lab b','middle');
  g += tx(5100,4680,'アイランド右下（H の奥）','lab','middle');
  Object.entries(MAP_MARK).forEach(([no,[x,y]]) => {
    const f = faceOf(no); const on = no === state.cur;
    const cls = 'mk' + (f ? '' : ' ghost') + (on ? ' on' : '') + (f && faceAllOk(f) ? ' okd' : '');
    const title = f ? `${no}｜${f.name}` : `${no}｜${MAP_NAME[no] || ''}（このページには未収録）`;
    g += `<g class="${cls}" data-no="${no}"><title>${esc(title)}</title><circle cx="${x}" cy="${y}" r="175"/><text x="${x}" y="${y}">${no}</text></g>`;
  });
  svg.innerHTML = g;
  svg.querySelectorAll('g.mk:not(.ghost)').forEach(el => el.addEventListener('click', () => selectFace(el.dataset.no)));
}
$('#mapBtn').addEventListener('click', () => { const p = $('#mapPane'); p.hidden = !p.hidden; $('#mapBtn').classList.toggle('on', !p.hidden); try{ localStorage.setItem('scaj_map', p.hidden ? '0' : '1'); }catch(e){}; fitPreview(); });
try { if (localStorage.getItem('scaj_map') === '0') { $('#mapPane').hidden = true; $('#mapBtn').classList.remove('on'); } } catch(e){}


/* ===== フォント読み込み完了までプレビューを隠す（読み込み時の文字の揺れ防止） ===== */
document.body.classList.add('fonts-loading');
(async () => {
  try {
    const fam = ['300 16px "Noto Sans JP"','400 16px "Noto Sans JP"','400 16px "Noto Serif JP"','500 16px "Noto Serif JP"'];
    await Promise.race([Promise.all(fam.map(f => document.fonts.load(f))).then(() => document.fonts.ready), new Promise(r => setTimeout(r, 3500))]);
  } catch(e){}
  document.body.classList.remove('fonts-loading'); fitPreview();
})();

function renderAll(){ renderFaces(); renderMap(); renderPreview(); renderEditor(); }
renderAll();
setStatus('保存先に接続中…');

/* ===== 共有保存（Firebase Realtime Database） ===== */
(function(){
  if (typeof firebase === 'undefined' || typeof FIREBASE_CONFIG === 'undefined' || !FIREBASE_CONFIG || !FIREBASE_CONFIG.databaseURL) {
    setStatus('保存先が未設定'); renderEditor(); return;
  }
  let fbdb;
  try { firebase.initializeApp(FIREBASE_CONFIG); fbdb = firebase.database(); }
  catch (e) { setStatus('保存先に接続できません'); renderEditor(); return; }
  const safeKey = id => String(id).replace(/[.#$\/\[\]]/g, '_');
  const flatten = (body) => {   // 1 段目のオブジェクトは子キーごとに書く（他の人の項目を消さないため）
    const out = {};
    for (const [k, v] of Object.entries(body)) {
      if (v && typeof v === 'object' && !Array.isArray(v) && ['texts','items','checks'].includes(k)) { for (const [id, val] of Object.entries(v)) out[k + '/' + safeKey(id)] = val; }
      else out[k] = v;
    }
    return out;
  };
  const unsafe = obj => obj;   // 表示側は安全化したキーのまま扱う（nodeId の ':' はそのまま使える）
  state.db = {
    doc: path => ({
      update: body => fbdb.ref(path).update(flatten(body)),
      set: body => fbdb.ref(path).update(flatten(body)),
      delete: () => fbdb.ref(path).remove(),
    }),
  };
  let raf = 0;
  const applyRender = () => {
    raf = 0;
    const active = document.activeElement; const editing = !!(active && active.dataset && active.dataset.id);
    renderFaces(); renderPreview();
    if (editing || state.busy) { if (editorSig() !== renderEditor.last) state.pendingRender = true; }
    else if (editorSig() !== renderEditor.last) renderEditor();
  };
  // 非表示タブでは requestAnimationFrame が止まるため setTimeout で代替（戻ったときに古い表示のままにならないように）
  const schedule = () => { if (raf) return; raf = document.hidden ? setTimeout(applyRender, 0) : requestAnimationFrame(applyRender); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(); });
  fbdb.ref('faces').on('value', snap => { state.docs = unsafe(snap.val() || {}); setStatus('接続済み'); schedule(); }, () => setStatus('接続が切れました'));
  fbdb.ref('approvals').on('value', snap => { state.approvals = unsafe(snap.val() || {}); schedule(); });
  fbdb.ref('meta/baseline').on('value', snap => { state.baseline = snap.val() || null; schedule(); });
  fbdb.ref('.info/connected').on('value', snap => { if (snap.val() === false) setStatus('オフライン（再接続待ち）'); });
  renderEditor();
})();
</script>
